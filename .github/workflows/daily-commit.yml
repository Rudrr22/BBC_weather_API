name: Daily Commit

on:
  schedule:
    # Runs at 8:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  daily-commit-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step with email 24f2004315@ds.study.iitm.ac.in
        run: echo "This step has the user's email in its name."

      - name: Configure Git and commit
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action-bot@github.com'
          echo "Last updated at $(date)" > last_updated.txt
          git add last_updated.txt
          git commit -m "Automated daily commit" || echo "No changes to commit"
          git push
